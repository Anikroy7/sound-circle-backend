# LOCAL DEVELOPMENT ONLY — PostgreSQL on a laptop. Port 5435, so it runs beside any other
# Postgres already on 5432–5434.
#
#   docker compose -f infra/docker/docker-compose.local.yml up -d

name: soundcircle-local

services:
  postgres:
    # PostgreSQL 18 with PostGIS 3.6 — `locations.center_point` is a PostGIS geography (schema-design §4.2).
    image: postgis/postgis:18-3.6-alpine
    container_name: soundcircle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: soundcircle
      POSTGRES_USER: soundcircle
      POSTGRES_PASSWORD: soundcircle
    ports:
      - "5435:5432"
    volumes:
      # PostgreSQL 18 moved the recommended mount point to /var/lib/postgresql; mounting
      # the old .../data path leaves the volume unused. See docker-library/postgres#1259.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundcircle -d soundcircle"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
